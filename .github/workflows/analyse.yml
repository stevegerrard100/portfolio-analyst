name: Portfolio Analysis

on:
  schedule:
    - cron: '0 6 * * 1-5'   # 07:00 BST (UK summer, UTC+1 ≈ Mar–Oct)
    - cron: '0 7 * * 1-5'   # 07:00 GMT (UK winter, UTC+0 ≈ Oct–Mar)
  workflow_dispatch:         # manual trigger

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 120     # T212 pie rate-limit (32s/pie) + screener can take 45+ min

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analysis pipeline
        env:
          T212_API_KEY:      ${{ secrets.T212_API_KEY }}
          T212_API_SECRET:   ${{ secrets.T212_API_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY:   ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY:         ${{ secrets.FRED_API_KEY }}
          NETLIFY_DISMISS_URL:  ${{ secrets.NETLIFY_DISMISS_URL }}
        run: python -m src.main

      - name: Persist actions cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f cache/last_actions.json
          git diff --cached --quiet || git commit -m "chore: update actions cache [skip ci]"
          git push origin HEAD:main --force-with-lease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:     ./output
          destination_dir: markets
          keep_files:      true
